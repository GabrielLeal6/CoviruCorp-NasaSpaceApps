# sites.yaml — Lunar landing sites for the Lunar Landing Site Navigator
#
# Built from NASA NSSDCA and LROC (Arizona State University) tables, retrieved 2026-11-13.
#
# Coordinate conventions (match context.md):
#   lat           planetocentric degrees, south negative
#   lon           EAST-positive degrees in [-180, 180]
#   lon_east_360  the same longitude as NASA publishes it (0..360 east)
#   frame         MOON_ME (mean Earth / polar axis, DE421), the frame NASA states for these tables
#   Precision: 0.001 degrees is about 30 m on the surface (NSSDCA note).
#
# Primary sources (NASA):
#   Apollo:            https://nssdc.gsfc.nasa.gov/planetary/lunar/lunar_sites.html
#                      (Wagner et al., Icarus 283, 92-103, 2017; Lunar Module coordinates used)
#   Everything else:   https://nssdc.gsfc.nasa.gov/planetary/lunar/lunar_artifact_impacts.html
#                      (table last updated 13 August 2025; it lists landers through 5 June 2025)
#   LROC page for each site is listed where the NASA table links one.
#
# Coverage of the south polar DEMs (80 deg S to the pole, about 304 km from the pole):
#   south_polar_dem.covered = false  -> outside the polar DEMs; the API must return COORD_OUT_OF_COVERAGE
#                                       unless a non-polar DEM adapter is added (context.md, hazard 7)
#   dist_from_pole_km is about (90 - |lat|) * 30.3 km. A site is fully covered for a given max_range when
#   dist_from_pole_km + max_range_km <= 304.
#
# Verify before use:
#   - Elevations come from the LROC 2016 table and the NASA IM-1 page. The reference surface is not stated in
#     the text I retrieved. Check it before comparing with a DEM.
#   - Landing outcomes are summarized from the NASA table's "Landing Type" column; read the LROC pages for detail.
#   - This file is not a mission-grade dataset. Coordinates can be revised by newer LROC imaging.

meta:
  generated: "2026-11-13"
  frame: MOON_ME
  reference_sphere_radius_m: 1737400
  nssdca_table_last_updated: "2025-08-13"
  polar_dem_coverage:
    lat_max_deg: -80.0
    radius_km: 304
  p0_candidates:
    # The three P0 sites in the blueprint must be inside the south polar DEMs.
    # Only two real landing sites qualify. The third is still to be chosen (see notes).
    - im2
    - im1
  p0_notes: >-
    IM-2 (84.79 S) is well inside coverage. IM-1 (80.13 S) sits about 299 km from the pole, right at the DEM
    edge, so a 100 km horizon range will be truncated; keep max_range small or flag horizon_truncated.
    Chang'e-7 is listed under planned_not_landed with low confidence. Three Artemis III candidates are now in
    planned_not_landed (Malapert Massif, Peak Near Shackleton, Nobile Rim 1) as approximate [Verify] placeholders;
    verify against the published region polygons before promoting one to the third P0 site.

