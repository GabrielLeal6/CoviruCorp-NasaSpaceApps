# ---------------------------------------------------------------------------
# Planned, not landed (low confidence, do not use as a validated site)
# ---------------------------------------------------------------------------
planned_not_landed:
  - id: change7_candidate
    name: Chang'e-7 candidate site (Shackleton crater rim)
    status: >-
      Launch was postponed on 23 August 2026 (tropical system near the Wenchang launch site). A 2 November 2026
      article describes the mission as poised to launch. I could not confirm a launch or landing as of 2026-11-13.
    lat: -88.8
    lon: 123.4
    lon_east_360: 123.4
    confidence: low
    coordinate_source: >-
      Secondary source only (a Wikipedia mirror citing a 2024 SpaceNews report). China has not published a final
      landing area, so treat this as a candidate area, not a target.
    south_polar_dem:
      covered: true
      dist_from_pole_km: 36
      truncated_at_100km_range: false
    notes: Would be an excellent test for terrain-aware illumination near the pole, once the real coordinates are known.

  - id: artemis3_malapert_massif
    name: "Artemis III candidate — Malapert Massif"
    status: >-
      One of NASA's 13 candidate Artemis III landing regions (announced 2022-08-19, RELEASE22-089). Not landed.
    lat: -86.0
    lon: 0.0
    lon_east_360: 0.0
    confidence: low
    coordinate_source: >-
      Region named in NASA RELEASE22-089 (https://www.nasa.gov/press-release/nasa-identifies-candidate-regions-for-landing-next-americans-on-moon).
      The release does not publish coordinates; this lat/lon is an approximate center to VERIFY against the published
      region polygons (LROC QuickMap Artemis III layer).
    south_polar_dem:
      covered: true
      dist_from_pole_km: 121
      truncated_at_100km_range: false
    notes: "[Verify] Approximate center only. Verify against the Artemis III region polygon before any use."

